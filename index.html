<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shamba Board — From Harvest to Opportunity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#087443; --green-dark:#045b34; --green-light:#e9f7ef; --lime:#9bd63b; --yellow:#f4c542;
  --dark:#10251a; --muted:#68766f; --white:#ffffff; --border:#e4ebe7; --bg:#f7faf8;
  --orange:#c07a1e; --orange-bg:#fbf1de; --red:#c14b3a; --red-bg:#fbe9e6;
  --shadow:0 20px 60px rgba(16,37,26,.10);
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{ font-family:"Inter",Arial,sans-serif; background:var(--bg); color:var(--dark); line-height:1.55; }
a{ text-decoration:none; color:inherit; }
button, select, input{ font-family:inherit; }
button{ cursor:pointer; border:0; }
.container{ width:min(1180px,92%); margin:auto; }
.hidden{ display:none !important; }

/* ---------- TOPBAR ---------- */
.navbar{ position:sticky; top:0; z-index:1000; background:#fff; border-bottom:1px solid var(--border); }
.nav-inner{ min-height:76px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:10px 0; }
.logo{ display:flex; align-items:center; gap:10px; cursor:pointer; }
.logo-mark{ width:40px; height:40px; border-radius:12px; background:var(--green); display:grid; place-items:center; color:#fff; font-size:19px; }
.logo-text{ font-weight:800; font-size:19px; letter-spacing:-.4px; }
.logo-text span{ color:var(--green); }
.nav-links{ display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
.nav-btn{ border:1px solid transparent; background:transparent; padding:9px 13px; border-radius:10px; font-weight:600; font-size:13px; color:var(--muted); }
.nav-btn:hover{ color:var(--dark); }
.nav-btn.active{ background:var(--green); color:#fff; }
.role-pill{ border:1px solid var(--border); background:#fff; padding:8px 12px; border-radius:20px; font-size:12px; font-weight:700; color:var(--muted); }
.role-pill.active{ background:var(--green-light); color:var(--green); border-color:var(--green-light); }
.nav-actions{ display:flex; align-items:center; gap:8px; }
.btn{ border:0; padding:11px 18px; border-radius:10px; font-weight:700; font-size:13.5px; transition:.2s; }
.btn-outline{ border:1px solid var(--border); background:#fff; color:var(--dark); }
.btn-outline:hover{ border-color:var(--green); }
.btn-primary{ background:var(--green); color:#fff; }
.btn-primary:hover{ background:var(--green-dark); transform:translateY(-1px); }
.btn-sm{ padding:8px 13px; font-size:12.5px; border-radius:9px; }
.bell-wrap{ position:relative; }
.bell-count{ position:absolute; top:-5px; right:-5px; background:var(--red); color:#fff; font-size:10px; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.notif-panel{ position:absolute; right:0; top:46px; width:280px; background:#fff; border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:10px; max-height:300px; overflow:auto; z-index:80; }
.notif-item{ font-size:12px; padding:8px 4px; border-top:1px solid var(--border); }
.notif-item:first-child{ border-top:none; }

/* ---------- GENERIC LAYOUT ---------- */
.screen{ padding:40px 0 80px; }
.section-header{ margin-bottom:26px; }
.kicker{ display:inline-flex; align-items:center; gap:7px; background:var(--green-light); color:var(--green); padding:7px 13px; border-radius:30px; font-size:12px; font-weight:800; letter-spacing:.2px; margin-bottom:14px; }
.kicker::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--lime); }
.section-title{ font-weight:800; font-size:clamp(24px,3.2vw,36px); letter-spacing:-1.2px; line-height:1.1; }
.section-sub{ color:var(--muted); font-size:14.5px; max-width:560px; margin-top:8px; }
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
@media (max-width:820px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

.card{ background:#fff; border:1px solid var(--border); border-radius:18px; padding:24px; }
.card h3{ font-size:16.5px; font-weight:800; margin-bottom:4px; }
.tag{ font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:20px; white-space:nowrap; }
.tag-demo{ background:var(--green-light); color:var(--green); }
.tag-estimate{ background:var(--orange-bg); color:var(--orange); }

.stat-strip{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:28px; }
.stat-card{ background:#fff; border:1px solid var(--border); border-radius:15px; padding:18px; }
.stat-num{ font-weight:850; font-size:24px; }
.stat-label{ font-size:12px; color:var(--muted); margin-top:3px; }

.field{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:var(--dark); margin-bottom:14px; }
.field-row{ display:flex; gap:12px; }
.field-row .field{ flex:1; }
input, select{ font-size:13.5px; padding:11px 12px; border:1px solid var(--border); border-radius:9px; background:#fff; color:var(--dark); font-weight:500; width:100%; outline:none; }
input:focus, select:focus{ border-color:var(--green); }

.ledger-row{ display:flex; justify-content:space-between; align-items:center; gap:14px; padding:15px 4px; border-top:1px solid var(--border); }
.ledger-row:first-child{ border-top:none; }
.crop-info{ display:flex; align-items:center; gap:12px; }
.crop-icon{ width:40px; height:40px; border-radius:11px; display:grid; place-items:center; background:var(--green-light); font-size:18px; flex-shrink:0; overflow:hidden; }
.crop-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
.avatar-icon{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--green-light); flex-shrink:0; overflow:hidden; }
.avatar-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
.hero-visual{ border-radius:22px; overflow:hidden; box-shadow:var(--shadow); }
.hero-visual img{ width:100%; height:100%; object-fit:cover; display:block; }
.passport-photo{ width:100%; height:120px; border-radius:12px; overflow:hidden; margin:4px 0 12px; }
.passport-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
.crop-name{ font-weight:800; font-size:14.5px; }
.crop-meta{ color:#7a8780; font-size:11.5px; margin-top:1px; }
.price-block{ text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.price-block strong{ font-size:14.5px; }
.trend-up{ color:var(--red); font-size:11px; font-weight:700; }
.trend-down{ color:var(--green); font-size:11px; font-weight:700; }

.pill{ font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:20px; white-space:nowrap; }
.pill-open,.pill-DELIVERED,.pill-ACCEPTED,.pill-COMPLETED{ background:var(--green-light); color:var(--green); }
.pill-partial,.pill-PENDING,.pill-IN_TRANSIT{ background:var(--orange-bg); color:var(--orange); }
.pill-sold,.pill-REMOVED{ background:var(--red-bg); color:var(--red); }

.score-badge{ font-weight:850; font-size:13px; padding:6px 11px; border-radius:9px; }
.score-hi{ background:var(--green-light); color:var(--green); }
.score-mid{ background:var(--orange-bg); color:var(--orange); }
.score-lo{ background:var(--red-bg); color:var(--red); }

.order-box{ display:flex; gap:6px; }
.order-box input{ width:90px; }
.empty{ font-size:13px; color:var(--muted); padding:14px 4px; }
.footnote{ font-size:11px; color:#8c968f; margin-top:10px; }

/* tabs for admin */
.tabbar{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.tabbtn{ border:1px solid var(--border); background:#fff; padding:9px 14px; border-radius:10px; font-size:12.5px; font-weight:700; color:var(--muted); }
.tabbtn.active{ background:var(--dark); color:#fff; border-color:var(--dark); }

/* bar chart */
.abar-row{ margin-bottom:13px; }
.abar-label{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; margin-bottom:5px; }
.abar-track{ height:10px; background:#e7eee9; border-radius:20px; overflow:hidden; }
.abar-fill{ height:100%; background:var(--green); border-radius:20px; }

/* landing (condensed) */
.hero{ padding:64px 0 44px; }
.hero-inner{ display:grid; grid-template-columns:1.1fr .9fr; gap:32px; align-items:center; }
@media (max-width:820px){ .hero-inner{ grid-template-columns:1fr; } .hero-visual{ order:-1; max-height:220px; } }
.hero h1{ font-weight:800; font-size:clamp(38px,5.5vw,62px); line-height:1.04; letter-spacing:-2.2px; max-width:680px; }
.hero h1 span{ color:var(--green); }
.hero p{ margin-top:18px; color:var(--muted); font-size:17px; max-width:540px; }
.hero-actions{ display:flex; gap:12px; margin-top:28px; flex-wrap:wrap; }
.flow-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:36px 0; }
.flow-col{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:20px; }
.flow-col h4{ font-size:14.5px; font-weight:800; margin-bottom:12px; }
.flow-step{ font-size:13px; padding:8px 0; border-top:1px solid var(--border); color:#3c453f; }
.flow-step:first-child{ border-top:none; }
.access-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:20px; }
.ussd-preview{ background:var(--dark); color:#cfe4d6; font-family:monospace; font-size:12.5px; border-radius:14px; padding:18px; margin-top:14px; line-height:1.9; }

/* auth */
.auth-wrap{ max-width:440px; margin:44px auto; }
.role-choice{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:16px 0 20px; }
.role-choice button{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:15px 8px; font-weight:700; font-size:12.5px; }
.role-choice button.sel{ border-color:var(--green); background:var(--green-light); color:var(--green); }

/* modal */
.modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:500; padding:20px; }
.modal{ background:#fff; border-radius:20px; padding:28px; max-width:400px; width:100%; box-shadow:var(--shadow); position:relative; }
.qr-block{ display:grid; grid-template-columns:repeat(8,1fr); gap:2px; width:120px; margin:16px auto; }
.qr-cell{ aspect-ratio:1; background:var(--dark); }
.passport-fields{ display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:12.5px; margin:14px 0; }
.passport-fields span{ display:block; color:var(--muted); font-size:10.5px; }
.phone-frame{ background:var(--dark); border-radius:22px; padding:14px; margin:14px 0; }
.phone-screen{ background:#dce8dc; border-radius:12px; padding:14px; min-height:220px; font-family:monospace; font-size:12.5px; color:var(--dark); }
.phone-screen label{ display:block; font-family:"Inter",sans-serif; font-size:11px; margin:8px 0 3px; }

footer{ background:#081810; color:#b5c2bb; padding:40px 0; font-size:12px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
</style>
</head>

    <div class="nav-actions" id="navActions"></div>
  </div>
</nav>

<div id="app"></div>

   ========================================================================= */
async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    state = res ? JSON.parse(res.value) : seedState();
  }catch(e){
    state = seedState();
  }
}
function persist(){
  window.storage.set(STORAGE_KEY, JSON.stringify(state), true).catch(()=>{});
}
function notify(text){
  state.notifications.unshift({ id:Date.now(), text });
  state.notifications = state.notifications.slice(0,15);
  persist();
}

/* =========================================================================
   DERIVED LOGIC
   ========================================================================= */
function waste(listing){
  const meta = CROP_META[listing.crop];
  const age = Math.round((Date.now()-new Date(listing.harvestDate))/86400000);
  const ratio = age/meta.shelfLife;
  if(ratio>=0.7) return "HIGH";
  if(ratio>=0.4) return "MEDIUM";
  return "LOW";
}
function trendPct(price,crop){ const ref=CROP_META[crop].refPrice; return Math.round(((price-ref)/ref)*100); }
function avgPriceFor(crop){
  const active = state.listings.filter(l=>l.crop===crop && l.status!=="sold" && l.status!=="removed");
  if(!active.length) return CROP_META[crop].refPrice;
  return Math.round(active.reduce((s,l)=>s+l.price,0)/active.length);
}
function opportunityScore(listing){
  const meta = CROP_META[listing.crop];
  let score = 50;
  score += meta.demand==="HIGH"?25:meta.demand==="MEDIUM"?8:-10;
  score += meta.supply==="HIGH"?-15:meta.supply==="MEDIUM"?-4:10;
  score += clamp(trendPct(listing.price,listing.crop),-15,15);
  const w = waste(listing);
  score += w==="HIGH"?-15:w==="MEDIUM"?-5:0;
  const marketOrders = state.orders.filter(o=>o.crop===listing.crop).length;
  score += clamp(marketOrders*2,0,10);
  return clamp(Math.round(score),0,100);
}
function scoreClass(score){ return score>=70?"score-hi":score>=45?"score-mid":"score-lo"; }
function recommendation(crop){
  const m = CROP_META[crop];
  if(m.demand==="HIGH" && m.supply!=="HIGH") return "SELL NOW";
  if(m.demand==="LOW") return "HOLD";
  return "SELL PARTIALLY";
}
function matchScore(listing, req){
  if(listing.crop!==req.crop) return 0;
  let s = 55;
  if(req.county==="Any" || listing.county===req.county) s += 15;
  if(listing.price<=req.maxPrice) s += 20;
  else if(listing.price<=req.maxPrice*1.1) s += 8;
  s += clamp(Math.round((listing.quantity/req.quantity)*10),0,10);
  return clamp(s,0,100);
}

/* =========================================================================
   TRUST LAYER
   A portable trust record per farmer — built from verification, county
   attestation, delivery history and dispute record. This is the actual
   product wedge: the score and its evidence trail are meant to be checked
   by ANY buyer or platform, not just inside Shamba Board.
   ========================================================================= */
function trustScore(farmer){
  let score = 35;
  if(state.verified[farmer]) score += 20;
  if(state.attestations[farmer]) score += 20;
  const delivered = state.orders.filter(o=>o.farmer===farmer && o.status==="DELIVERED").length;
  score += clamp(delivered*8, 0, 20);
  const disputes = state.disputes[farmer] || 0;
  score -= disputes*18;
  return clamp(Math.round(score), 0, 100);
}
function trustTier(score){ return score>=75 ? "Trusted" : score>=45 ? "Building" : "New"; }
function trustId(farmer){
  let h = 0;
  for(let i=0;i<farmer.length;i++){ h = (h*31 + farmer.charCodeAt(i)) >>> 0; }
  return "STB-TR-" + (1000 + (h % 9000));
}
function trustBadge(farmer, size){
  const s = trustScore(farmer);
  const sm = size==="sm" ? ' style="padding:4px 8px;font-size:10px;"' : "";
  return `<span class="score-badge ${scoreClass(s)}"${sm} title="View portable trust record" style="cursor:pointer;${size==='sm'?'padding:4px 8px;font-size:10px;':''}" onclick="event.stopPropagation(); openTrustModal('${farmer.replace(/'/g,"\\'")}')">🛡 ${s} · ${trustTier(s)}</span>`;
}

/* =========================================================================
   MUTATIONS
   ========================================================================= */
function addListing(l){
  const listing = { ...l, id:"L"+state.seq, status:"open", harvestDate:daysAgo(0) };
  state.listings.push(listing);
  state.seq++;
  persist();
  notify(`${listing.farmer} published ${listing.quantity}kg of ${listing.crop}.`);
}
function placeOrder(listing, qty, buyer, reqId){
  qty = Math.min(qty, listing.quantity);
  const remaining = listing.quantity - qty;
  listing.quantity = Math.max(remaining,0);
  listing.status = remaining<=0 ? "sold" : "partial";
  const order = {
    id:"O"+state.seq, crop:listing.crop, county:listing.county, quantity:qty, price:listing.price,
    farmer:listing.farmer, buyer, grade:listing.grade, status:"PENDING", harvestDate:listing.harvestDate, reqId:reqId||null
  };
  state.orders.push(order);
  state.seq++;
  persist();
  notify(`${buyer} ordered ${qty}kg of ${listing.crop} from ${listing.farmer}.`);
}
function advanceOrder(id, nextStatus){
  const order = state.orders.find(o=>o.id===id);
  if(!order) return;
  order.status = nextStatus;
  if(nextStatus==="DELIVERED"){
    const passport = {
      batch:`SB-2026-${1000+state.seq}`, crop:order.crop, quantity:order.quantity, grade:order.grade,
      farmer:order.farmer, county:order.county, buyer:order.buyer, harvestDate:order.harvestDate, status:"DELIVERED"
    };
    state.passports.push(passport);
    state.seq++;
    persist();
    notify(`Order ${id} delivered — passport ${passport.batch} generated.`);
    openPassportModal(passport);
    return;
  }
  persist();
  notify(`Order ${id} moved to ${nextStatus.replace("_"," ")}.`);
}
function toggleVerified(name){
  state.verified[name] = !state.verified[name];
  persist();
}
function attestFarmer(name){
  state.attestations[name] = { by:"County Agriculture Office", date:daysAgo(0) };
  persist();
  notify(`${name} received a county attestation — trust record updated.`);
}
function logDispute(name){
  state.disputes[name] = (state.disputes[name]||0) + 1;
  persist();
  notify(`Dispute logged against ${name} — trust record updated.`);
}
function removeListing(id){
  const l = state.listings.find(x=>x.id===id);
  if(l){ l.status="removed"; persist(); notify(`Listing ${id} removed by admin.`); }
}
function resetDemo(){
  state = seedState();
  persist();
  currentRole = null;
  goLanding();
}

  const crop = document.getElementById("rCrop").value;
  const qty = Number(document.getElementById("rQty").value);
  const price = Number(document.getElementById("rPrice").value);
  const county = document.getElementById("rCounty").value;
  if(!qty||!price) return;
  state.procurementRequests.push({ id:"R"+state.seq, buyer:DEMO_BUYER, crop, quantity:qty, maxPrice:price, county, createdAt:daysAgo(0) });
  state.seq++;
  persist();
  notify(`${DEMO_BUYER} requested ${qty}kg of ${crop}.`);
  render();
}

/* =========================================================================
   SCREEN: LIVE MARKET LEDGER
   ========================================================================= */
function screenLedger(){
  const listings = state.listings
    .filter(l=>l.status!=="sold" && l.status!=="removed")
    .filter(l=>ledgerCropFilter==="All crops" || l.crop===ledgerCropFilter)
    .filter(l=>ledgerCountyFilter==="All counties" || l.county===ledgerCountyFilter)
    .sort((a,b)=>opportunityScore(b)-opportunityScore(a));

  return `
  <section class="screen"><div class="container">
    <div class="section-header">
      <div class="kicker">Live</div>
      <div class="section-title">Market Ledger</div>
      <p class="section-sub">Every open listing, ranked by Market Opportunity Score.</p>
    </div>
    <div class="card">
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
        <select onchange="ledgerCropFilter=this.value; render();">
          <option ${ledgerCropFilter==='All crops'?'selected':''}>All crops</option>
          ${Object.keys(CROP_META).map(c=>`<option ${ledgerCropFilter===c?'selected':''}>${c}</option>`).join("")}
        </select>
        <select onchange="ledgerCountyFilter=this.value; render();">
          <option ${ledgerCountyFilter==='All counties'?'selected':''}>All counties</option>
          ${COUNTIES.map(c=>`<option ${ledgerCountyFilter===c?'selected':''}>${c}</option>`).join("")}
        </select>
      </div>
      ${listings.length===0 ? `<div class="empty">Nothing matches those filters.</div>` :
        listings.map(l=>{
          const t = trendPct(l.price,l.crop);
          const score = opportunityScore(l);
          const drafted = orderDraft[l.id] || "";
          return `<div class="ledger-row">
            <div class="crop-info">
              <div class="crop-icon">${cropImg(l.crop)}</div>
              <div>
                <div class="crop-name">${l.crop}</div>
                <div class="crop-meta">${l.farmer} · ${l.county} · ${l.quantity} kg · Grade ${l.grade}</div>
                <div style="margin-top:4px;">${trustBadge(l.farmer,"sm")}</div>
                <div class="${t>=0?'trend-up':'trend-down'}">${t>=0?'▲':'▼'} ${Math.abs(t)}% vs reference</div>
              </div>
            </div>
            <div class="price-block">
              <strong>${fmtKsh(l.price)}/kg</strong>
              <span class="score-badge ${scoreClass(score)}">Opportunity ${score}</span>
              <div class="order-box">
                <input type="number" min="1" max="${l.quantity}" placeholder="kg" value="${drafted}" onchange="orderDraft['${l.id}']=this.value">
                <button class="btn btn-sm btn-primary" onclick="orderFromLedger('${l.id}')">Order</button>
              </div>
            </div>
          </div>`;
        }).join("")}
    </div>
  </div></section>`;
}
function orderFromLedger(id){
  const listing = state.listings.find(l=>l.id===id);
  const qty = Number(orderDraft[id]);
  if(!listing || !qty || qty<=0) return;
  placeOrder(listing, qty, DEMO_BUYER, null);
  delete orderDraft[id];
  render();
}

/* =========================================================================
   SCREEN: DEMAND BOARD
   ========================================================================= */
function screenDemand(){
  const crops = Object.keys(CROP_META);
  return `
  <section class="screen"><div class="container">
    <div class="section-header">
      <div class="kicker">Where is the market?</div>
      <div class="section-title">Demand Board</div>
      <p class="section-sub">Aggregated buyer demand vs. available supply, per crop.</p>
    </div>
    <div class="grid-3">
      ${crops.map(crop=>{
        const demandKg = state.procurementRequests.filter(r=>r.crop===crop).reduce((s,r)=>s+r.quantity,0);
        const supplyKg = state.listings.filter(l=>l.crop===crop && l.status!=="sold" && l.status!=="removed").reduce((s,l)=>s+l.quantity,0);
        const gap = demandKg - supplyKg;
        return `<div class="card">
          <div style="display:flex;justify-content:space-between;"><h3>${CROP_META[crop].icon} ${crop}</h3></div>
          <div class="footnote" style="margin:6px 0 10px;">Demand ${demandKg.toLocaleString()} kg · Supply ${supplyKg.toLocaleString()} kg</div>
          ${gap>0 ? `<span class="pill pill-PENDING">MATCH OPPORTUNITY · gap ${gap.toLocaleString()} kg</span>` : `<span class="pill pill-open">Supply covers demand</span>`}
        </div>`;
      }).join("")}
    </div>
  </div></section>`;
}

/* =========================================================================
   SCREEN: SMART MATCHING
   ========================================================================= */
function screenMatching(){
  const myRequests = state.procurementRequests.filter(r=>r.buyer===DEMO_BUYER);
  if(!matchRequestId && myRequests.length) matchRequestId = myRequests[0].id;
  const req = state.procurementRequests.find(r=>r.id===matchRequestId);
  const candidates = req ? state.listings
    .filter(l=>l.status!=="sold" && l.status!=="removed")
    .map(l=>({ l, score: matchScore(l,req) }))
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score) : [];

  return `
  <section class="screen"><div class="container">
    <div class="section-header">
      <div class="kicker">Intelligent matching</div>
      <div class="section-title">Smart Matching</div>
      <p class="section-sub">Pick a procurement request — candidates are ranked by crop fit, price fit and quantity coverage.</p>
    </div>
    <div class="card" style="margin-bottom:20px;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        ${myRequests.map(r=>`<button class="tabbtn ${matchRequestId===r.id?'active':''}" onclick="matchRequestId='${r.id}'; render();">${r.crop} · ${r.quantity}kg</button>`).join("")}
        ${myRequests.length===0 ? `<span class="empty">Create a procurement request from the Buyer dashboard first.</span>` : ""}
      </div>
    </div>
    ${req ? `<div class="card">
      <h3>Best matches for ${req.crop} · ${req.quantity}kg needed · up to ${fmtKsh(req.maxPrice)}/kg</h3>
      ${candidates.length===0 ? `<div class="empty">No listings currently match this request.</div>` :
        candidates.map(({l,score})=>`
        <div class="ledger-row">
          <div class="crop-info">
            <div class="crop-icon">${cropImg(l.crop)}</div>
            <div><div class="crop-name">${l.farmer}</div><div class="crop-meta">${l.county} · ${l.quantity} kg available · ${fmtKsh(l.price)}/kg</div><div style="margin-top:4px;">${trustBadge(l.farmer,"sm")}</div></div>
          </div>
          <div class="price-block">
            <span class="score-badge ${scoreClass(score)}">Match ${score}%</span>
            <button class="btn btn-sm btn-primary" onclick="requestSupply('${l.id}','${req.id}')">Request supply</button>
          </div>
        </div>`).join("")}
    </div>` : ""}
  </div></section>`;
}
function requestSupply(listingId, reqId){
  const listing = state.listings.find(l=>l.id===listingId);
  const req = state.procurementRequests.find(r=>r.id===reqId);
  if(!listing||!req) return;
  const qty = Math.min(listing.quantity, req.quantity);
  placeOrder(listing, qty, DEMO_BUYER, reqId);
  render();
}

/* =========================================================================
   SCREEN: ANALYTICS
   ========================================================================= */
function screenAnalytics(){
  const totalKg = state.orders.reduce((s,o)=>s+o.quantity,0);
  const totalValue = state.orders.reduce((s,o)=>s+o.quantity*o.price,0);
  const avgOrder = state.orders.length ? Math.round(totalValue/state.orders.length) : 0;
  const byCrop = {};
  state.orders.forEach(o=>{ byCrop[o.crop] = (byCrop[o.crop]||0) + o.quantity*o.price; });
  const maxCrop = Math.max(1, ...Object.values(byCrop));

  return `
  <section class="screen"><div class="container">
    <div class="section-header">
      <div class="kicker">Platform analytics</div>
      <div class="section-title">Analytics</div>
    </div>
    <div class="stat-strip">
      <div class="stat-card"><div class="stat-num">${state.orders.length}</div><div class="stat-label">total transactions</div></div>
      <div class="stat-card"><div class="stat-num">${totalKg.toLocaleString()} kg</div><div class="stat-label">produce traded</div></div>
      <div class="stat-card"><div class="stat-num">${fmtKsh(totalValue)}</div><div class="stat-label">total value traded</div></div>
      <div class="stat-card"><div class="stat-num">${fmtKsh(avgOrder)}</div><div class="stat-label">average order value</div></div>
    </div>
    <div class="card">
      <h3>Revenue by crop</h3>
      <p class="section-sub" style="margin-bottom:14px;">This session only.</p>
      ${Object.keys(byCrop).length===0 ? `<div class="empty">No completed transactions yet — place an order to see this fill in.</div>` :
        Object.entries(byCrop).sort((a,b)=>b[1]-a[1]).map(([crop,val])=>`
        <div class="abar-row">
          <div class="abar-label"><span>${crop}</span><span>${fmtKsh(val)}</span></div>
          <div class="abar-track"><div class="abar-fill" style="width:${(val/maxCrop)*100}%"></div></div>
        </div>`).join("")}
    </div>
  </div></section>`;
}

function openTrustModal(farmer){
  const s = trustScore(farmer);
  const tier = trustTier(s);
  const att = state.attestations[farmer];
  const delivered = state.orders.filter(o=>o.farmer===farmer && o.status==="DELIVERED").length;
  const disputes = state.disputes[farmer] || 0;
  const verified = !!state.verified[farmer];
  const color = s>=75?"var(--green)":s>=45?"var(--orange)":"var(--red)";
  document.getElementById("modalRoot").innerHTML = `
  <div class="modal-backdrop" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
        <div><div style="font-weight:800;">Shamba Trust Record</div><div class="footnote">${farmer}</div></div>
        <span class="tag tag-demo">Demo data</span>
      </div>
      <div style="text-align:center;margin:16px 0 10px;">
        <div style="font-size:40px;font-weight:850;color:${color};line-height:1;">${s}</div>
        <div class="footnote" style="margin-top:4px;">${tier} · Trust ID ${trustId(farmer)}</div>
      </div>
      <div class="qr-block">${Array.from({length:64}).map((_,i)=>`<div class="qr-cell" style="opacity:${(i*53)%7<3?1:0.08}"></div>`).join("")}</div>
      <div class="passport-fields">
        <div><span>Identity verified</span><strong>${verified?"Yes":"No"}</strong></div>
        <div><span>County attestation</span><strong>${att?att.by:"None yet"}</strong></div>

        <div><span>Disputes on record</span><strong>${disputes}</strong></div>
      </div>
      <p class="footnote" style="margin-bottom:14px;">This record is built to travel with the farmer — checkable by any buyer, broker or platform, not only Shamba Board. Simulated QR for demo purposes; production would generate a scannable, publicly verifiable record.</p>
      <button class="btn btn-primary" style="width:100%;" onclick="closeModal()">Close</button>
    </div>
  </div>`;
}

  renderUssdModal();
}

  let body = "";
  if(ussdDone){
    body = `<div class="phone-screen"><strong>Listing received</strong><p style="margin-top:8px;font-family:'DM Sans',sans-serif;">Your ${ussdForm.crop} listing is now visible to buyers on Shamba Board.</p></div>`;
  } else if(ussdScreen==="menu"){
    body = `<div class="phone-screen">
      <strong>*483#</strong><br>1. Sell produce<br>2. Market prices<br>3. Find buyers<br>4. My orders<br>5. Market alerts
      <div style="margin-top:10px;"><button class="btn btn-sm btn-primary" onclick="ussdScreen='sell'; renderUssdModal();">Select 1 — Sell produce</button></div>
    </div>`;
  } else {
    body = `<div class="phone-screen">
      <strong>Sell produce</strong>
      <label>Name</label><input value="${ussdForm.farmer}" oninput="ussdForm.farmer=this.value">
      <label>Crop</label><select onchange="ussdForm.crop=this.value">${Object.keys(CROP_META).map(c=>`<option ${ussdForm.crop===c?'selected':''}>${c}</option>`).join("")}</select>
      <label>County</label><select onchange="ussdForm.county=this.value">${COUNTIES.map(c=>`<option ${ussdForm.county===c?'selected':''}>${c}</option>`).join("")}</select>

      <label>Price (KSh/kg)</label><input type="number" value="${ussdForm.price}" oninput="ussdForm.price=this.value">

      <div class="footnote" style="margin-bottom:8px;">USSD/SMS simulator — illustrates low-connectivity access, not connected to a live telecom aggregator.</div>
      <div class="phone-frame">${body}</div>
      <button class="btn btn-outline" style="width:100%;" onclick="closeModal()">Close simulator</button>
    </div>
  </div>`;
}
function submitUssd(){
  if(!ussdForm.farmer || !ussdForm.quantity || !ussdForm.price) return;
  addListing({ crop:ussdForm.crop, county:ussdForm.county, farmer:ussdForm.farmer, quantity:Number(ussdForm.quantity), price:Number(ussdForm.price), grade:"B" });
  ussdDone = true;
  renderUssdModal();
  render();
}
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; render(); }
